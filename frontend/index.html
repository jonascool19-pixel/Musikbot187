<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RadioBot 4</title><link rel="stylesheet" href="/style.css"></head><body><div id="app"><aside><h1>🎛️ RadioBot</h1><nav><button data-v="dash">Dashboard</button><button data-v="search">🔎 Suche</button><button data-v="radio">📻 Radio</button><button data-v="playlists">📋 Playlists</button><button data-v="instances">🎧 Instanzen</button><button data-v="settings">⚙️ Einstellungen</button></nav><div id="sideStatus" class="muted"></div></aside><main><header><div><b id="now">Nichts läuft</b><small id="sub">Bereit</small></div><div class="controls"><button onclick="act('pause')">⏸</button><button onclick="act('resume')">▶</button><button onclick="act('skip')">⏭</button><button onclick="act('stop')">⏹</button><input id="vol" type="range" min="0" max="100" value="80" oninput="volume(this.value)"></div></header><section id="content"></section></main></div><div id="login" class="hidden"></div><script src="/app.js"></script></body></html>
