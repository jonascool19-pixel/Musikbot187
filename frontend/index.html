<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MusikBot187</title><link rel="stylesheet" href="style.css"></head><body><main><header><h1>MusikBot187</h1><span id="status">Offline</span></header><section id="login"><h2>Anmelden</h2><input id="name" placeholder="Benutzer"><input id="pass" type="password" placeholder="Passwort"><button onclick="login()">Anmelden</button><div id="setup"></div></section><section id="app" hidden><div class="grid"><div><h2>Suche</h2><div class="row"><input id="q" placeholder="Titel, Interpret, Sender…"><button onclick="playUrl()">URL abspielen</button><select id="source"><option value="all">Alles</option><option value="youtube">YouTube</option><option value="radio">Radio</option><option value="spotify">Spotify</option></select><button onclick="search()">Suchen</button></div><div id="results"></div></div><div><h2>Player</h2><div id="current">Nichts läuft</div><div class="row"><button onclick="act('pause')">Pause</button><button onclick="act('resume')">Weiter</button><button onclick="act('skip')">Skip</button><button onclick="act('stop')">Stop</button><button onclick="act('clear')">Queue leeren</button></div><label>Lautstärke <input id="vol" type="range" min="0" max="100" value="75" oninput="volume(this.value)"></label><div class="row"><button onclick="mode('queue')">Queue</button><button onclick="mode('repeat')">Repeat</button><button onclick="mode('shuffle')">Shuffle</button></div></div><div><h2>Queue</h2><ol id="queue"></ol></div><div><h2>Playlists</h2><input id="plname" placeholder="Playlist"><button onclick="playlistCreate()">Erstellen</button><div id="playlists"></div></div><div><h2>Dateien</h2><div id="files"></div></div><div><h2>Verbindungen</h2><div id="connections"></div></div></div></section></main><script src="app.js"></script></body></html>
