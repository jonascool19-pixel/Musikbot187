<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RadioBot</title><link rel="stylesheet" href="/style.css"></head><body><div id="app"><aside><h1>🎧 RadioBot</h1><nav><button data-view="dashboard">Dashboard</button><button data-view="search">Suche</button><button data-view="radio">Radio</button><button data-view="playlists">Playlists</button><button data-view="instances">Instanzen</button><button data-view="settings">Einstellungen</button></nav><div id="status"></div></aside><main><header><div><strong id="now">Nichts läuft</strong><small id="sub">Bereit</small></div><div class="controls"><button onclick="act('pause')">⏸</button><button onclick="act('resume')">▶</button><button onclick="act('skip')">⏭</button><button onclick="act('stop')">⏹</button><input id="vol" type="range" min="0" max="100" value="80" oninput="volume(this.value)"></div></header><section id="content"></section></main></div><div id="login" class="modal hidden"></div><script src="/app.js"></script></body></html>
