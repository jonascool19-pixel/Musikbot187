<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MusikBot187 4.0.0</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#101114;color:#eee}main{max-width:1100px;margin:auto;padding:20px}.card{background:#181a1f;border:1px solid #2b2e36;border-radius:12px;padding:16px;margin:12px 0}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}input,button,select{font:inherit;padding:9px;border-radius:8px;border:1px solid #3a3e49;background:#111319;color:#eee}button{cursor:pointer}.tabs button{margin:4px}.tab{display:none}.tab.active{display:block}.muted{color:#9ea4b0}.err{color:#ff7272}.item{padding:8px 0;border-bottom:1px solid #2b2e36}</style></head><body><main><h1>MusikBot187 4.0.0</h1><section id="login" class="card"><h2>Anmelden</h2><div class="row"><input id="user" placeholder="Benutzer"><input id="pass" type="password" placeholder="Passwort"><button onclick="login()">Login</button></div><p id="loginmsg" class="err"></p></section><section id="setup" class="card" hidden><h2>Ersteinrichtung</h2><div class="row"><input id="su" placeholder="Admin-Benutzer"><input id="sp" type="password" placeholder="Passwort (mind. 12 Zeichen)"><input id="st" placeholder="Setup-Token"><button onclick="setup()">Admin anlegen</button></div><p id="setupmsg" class="err"></p></section><section id="dash" hidden><div class="tabs"><button onclick="tab('player')">Player</button><button onclick="tab('search')">Suche</button><button onclick="tab('music')">Musik</button><button onclick="tab('playlists')">Playlists</button><button onclick="tab('connections')">Verbindungen</button><button onclick="logout()">Logout</button></div><section id="player" class="card tab active"><div class="row"><button onclick="pause()">Pause</button><button onclick="resume()">Weiter</button><button onclick="skip()">Skip</button><button onclick="stop()">Stop</button><button onclick="clearQ()">Queue leeren</button><label>Lautstärke <input id="vol" type="range" min="0" max="100" value="100" onchange="volume(this.value)"></label></div><h3>Jetzt läuft</h3><div id="now" class="muted">–</div><h3>Queue</h3><div id="queue" class="muted">–</div></section><section id="search" class="card tab"><div class="row"><input id="query" placeholder="Interpret, Titel oder URL" style="min-width:320px"><select id="src"><option value="youtube">YouTube</option><option value="radio">Radio</option><option value="spotify">Spotify</option></select><button onclick="search()">Suchen</button></div><div id="results"></div></section><section id="music" class="card tab"><h3>Lokale Musik</h3><div class="row"><input id="upload" type="file" accept="audio/*"><button onclick="upload()">Hochladen</button></div><div id="musiclist"></div></section><section id="playlists" class="card tab"><div class="row"><input id="plname" placeholder="Neue Playlist"><button onclick="createPlaylist()">Erstellen</button></div><div id="pllist"></div></section><section id="connections" class="card tab"><h3>Discord</h3><div class="row"><input id="did" placeholder="ID"><input id="dtok" type="password" placeholder="Bot-Token"><input id="dgid" placeholder="Guild-ID"><input id="dvid" placeholder="Voice-Channel-ID"><button onclick="discordConnect()">Verbinden</button><button onclick="discordDisconnect()">Trennen</button></div><h3>TeamSpeak 3</h3><div class="row"><input id="tid" placeholder="ID"><input id="thost" placeholder="Host"><input id="tport" value="9987"><input id="tnick" value="MusikBot187"><input id="tchan" placeholder="Kanal"><input id="tpass" type="password" placeholder="Passwort"><button onclick="tsConnect()">Verbinden</button><button onclick="tsDisconnect()">Trennen</button></div><p class="muted">Discord und TS3 werden erst verbunden, wenn die Zugangsdaten eingetragen wurden.</p></section></section></main><script>let token=localStorage.getItem('mb4token');const api=(p,o={})=>fetch('/api'+p,{...o,headers:{...(o.body instanceof FormData?{}:{'Content-Type':'application/json'}),Authorization:`Bearer ${token||''}`}}).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error||'Fehler');return d});function show(){const setupMode=location.hash.startsWith('#setup=');login.hidden=!!token||setupMode;setup.hidden=!setupMode;dash.hidden=!token}async function login(){try{const d=await api('/auth/login',{method:'POST',body:JSON.stringify({username:user.value,password:pass.value})});token=d.token;localStorage.setItem('mb4token',token);show();refresh()}catch(e){loginmsg.textContent=e.message}}async function setup(){try{const d=await api('/setup',{method:'POST',body:JSON.stringify({username:su.value,password:sp.value,token:st.value})});setupmsg.textContent=d.ok?'Admin angelegt. Danach Login öffnen.':'Fehler'}catch(e){setupmsg.textContent=e.message}}function tab(id){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');if(id==='music')loadMusic();if(id==='playlists')loadPlaylists()}async function refresh(){try{const d=await api('/state');now.textContent=d.current?.title||'–';queue.innerHTML=d.queue.length?d.queue.map((x,i)=>`${i+1}. ${x.title||x.url}`).join('<br>'):'–';vol.value=d.volume;await loadMusic();await loadPlaylists()}catch{logout()}}async function pause(){await api('/player/pause',{method:'POST',body:'{}'});refresh()}async function resume(){await api('/player/resume',{method:'POST',body:'{}'});refresh()}async function skip(){await api('/player/skip',{method:'POST',body:'{}'});refresh()}async function stop(){await api('/player/stop',{method:'POST',body:'{}'});refresh()}async function clearQ(){await api('/player/clear',{method:'POST',body:'{}'});refresh()}async function volume(v){await api('/player/volume',{method:'POST',body:JSON.stringify({percent:+v})});refresh()}async function search(){try{const q=encodeURIComponent(query.value);const d=await api('/search/'+src.value+'?q='+q);results.innerHTML=d.results.map(x=>`<div class="item"><b>${esc(x.title)}</b> <button onclick='playItem(${JSON.stringify(x)})'>Play</button></div>`).join('')||'<p class="muted">Keine Treffer</p>'}catch(e){results.textContent=e.message}}async function playItem(x){await api('/player/play',{method:'POST',body:JSON.stringify(x)});tab('player');refresh()}async function loadMusic(){try{const d=await api('/music');musiclist.innerHTML=d.files.map(f=>`<div class="item">${esc(f.name)} <button onclick='playItem(${JSON.stringify({source:'local',path:f.name,url:f.name,title:f.name})})'>Play</button> <button onclick='delMusic(${JSON.stringify(f.name)})'>Löschen</button></div>`).join('')||'<p class="muted">Keine Dateien</p>'}catch(e){musiclist.textContent=e.message}}async function upload(){const f=uploadEl();if(!f)return;const fd=new FormData();fd.append('file',f);try{await api('/music/upload',{method:'POST',body:fd});loadMusic()}catch(e){alert(e.message)}}function uploadEl(){return document.getElementById('upload').files[0]}async function delMusic(n){await api('/music/'+encodeURIComponent(n),{method:'DELETE'});loadMusic()}async function loadPlaylists(){try{const d=await api('/playlists');pllist.innerHTML=d.map(p=>`<div class="item"><b>${esc(p.name)}</b> (${p.tracks.length}) <button onclick="playList('${p.id}')">Play</button><button onclick="delList('${p.id}')">Löschen</button></div>`).join('')||'<p class="muted">Keine Playlists</p>'}catch(e){pllist.textContent=e.message}}async function createPlaylist(){await api('/playlists',{method:'POST',body:JSON.stringify({name:plname.value})});plname.value='';loadPlaylists()}async function playList(id){await api('/playlists/'+id+'/play',{method:'POST',body:'{}'});tab('player');refresh()}async function delList(id){await api('/playlists/'+id,{method:'DELETE'});loadPlaylists()}async function discordConnect(){try{await api('/discord/connect',{method:'POST',body:JSON.stringify({id:did.value,token:dtok.value,guildId:dgid.value,voiceChannelId:dvid.value})});alert('Discord verbunden')}catch(e){alert(e.message)}}async function discordDisconnect(){await api('/discord/disconnect',{method:'POST',body:JSON.stringify({id:did.value})})}async function tsConnect(){try{await api('/ts3/connect',{method:'POST',body:JSON.stringify({id:tid.value,host:thost.value,port:+tport.value,nickname:tnick.value,channel:tchan.value,password:tpass.value})});alert('TS3 verbunden')}catch(e){alert(e.message)}}async function tsDisconnect(){await api('/ts3/disconnect',{method:'POST',body:JSON.stringify({id:tid.value})})}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function logout(){token=null;localStorage.removeItem('mb4token');show()}const h=location.hash.startsWith('#setup=')?location.hash.slice(7):'';if(h)st.value=decodeURIComponent(h);show();if(token)refresh();setInterval(()=>{if(token)refresh()},3000)</script></body></html>
