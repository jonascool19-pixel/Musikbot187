<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MusikBot187</title><style>body{font-family:system-ui;margin:0;background:#111;color:#eee}main{max-width:980px;margin:auto;padding:24px}input,button{font:inherit;padding:10px;border-radius:8px;border:1px solid #444;background:#1b1b1b;color:#eee}button{cursor:pointer}section{background:#181818;border:1px solid #2b2b2b;border-radius:12px;padding:16px;margin:14px 0}.row{display:flex;gap:8px;flex-wrap:wrap}.muted{color:#aaa}.error{color:#ff7777}</style></head><body><main><h1>MusikBot187 4.0.0</h1><section id="login"><h2>Login</h2><div class="row"><input id="user" placeholder="Benutzer"><input id="pass" type="password" placeholder="Passwort"><button onclick="login()">Login</button></div><p id="loginmsg" class="error"></p></section><section id="setup" hidden><h2>Erstsetup</h2><p>Setup-Link aus dem Installer verwenden.</p><div class="row"><input id="su" placeholder="Admin-Benutzer"><input id="sp" type="password" placeholder="Passwort (mind. 12 Zeichen)"><input id="st" placeholder="Setup-Token"><button onclick="setup()">Admin anlegen</button></div><p id="setupmsg" class="error"></p></section><section id="app" hidden><div class="row"><input id="q" placeholder="Song, Künstler oder YouTube-URL" style="min-width:300px"><button onclick="search()">YouTube suchen</button><button onclick="pause()">Pause</button><button onclick="resume()">Weiter</button><button onclick="skip()">Skip</button><button onclick="stop()">Stop</button></div><div id="results"></div><h3>Aktuell</h3><div id="now" class="muted">–</div><h3>Queue</h3><div id="queue" class="muted">–</div><h3>Lautstärke</h3><input id="vol" type="range" min="0" max="100" value="100" onchange="volume(this.value)"><button onclick="logout()">Logout</button></section></main><script>let token=localStorage.getItem('mbtoken');const api=(u,o={})=>fetch('/api'+u,{...o,headers:{'Content-Type':'application/json',Authorization:`Bearer ${token||''}`}}).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error||'Fehler');return d});function show(){const setupMode=location.hash.startsWith('#setup=');document.querySelector('#login').hidden=!!token||setupMode;document.querySelector('#setup').hidden=!setupMode;document.querySelector('#app').hidden=!token}async function login(){try{const d=await api('/auth/login',{method:'POST',body:JSON.stringify({username:user.value,password:pass.value})});token=d.token;localStorage.setItem('mbtoken',token);show();refresh()}catch(e){loginmsg.textContent=e.message}}async function setup(){try{const r=await fetch('/api/setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:su.value,password:sp.value,token:st.value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Fehler');setupmsg.textContent='Admin angelegt. Jetzt einloggen.'}catch(e){setupmsg.textContent=e.message}}async function search(){try{const d=await api('/search/youtube?q='+encodeURIComponent(q.value));results.innerHTML=d.results.map(x=>`<p>${x.title} <button onclick='play(${JSON.stringify(x)})'>Play</button></p>`).join('')}catch(e){results.textContent=e.message}}async function play(x){await api('/player/play',{method:'POST',body:JSON.stringify(x)});refresh()}async function pause(){await api('/player/pause',{method:'POST',body:'{}'});refresh()}async function resume(){await api('/player/resume',{method:'POST',body:'{}'});refresh()}async function skip(){await api('/player/skip',{method:'POST',body:'{}'});refresh()}async function stop(){await api('/player/stop',{method:'POST',body:'{}'});refresh()}async function volume(v){await api('/player/volume',{method:'POST',body:JSON.stringify({percent:Number(v)})})}async function refresh(){try{const d=await api('/state');now.textContent=d.current?.title||'–';queue.innerHTML=d.queue.length?d.queue.map((x,i)=>`${i+1}. ${x.title||x.url}`).join('<br>'):'–'}catch{logout()}}function logout(){token=null;localStorage.removeItem('mbtoken');show()}const setupHash=location.hash.startsWith('#setup=')?location.hash.slice(7):'';if(setupHash)st.value=decodeURIComponent(setupHash);show();if(token)refresh();</script></body></html>
