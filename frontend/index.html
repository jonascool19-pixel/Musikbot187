<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MusikBot187</title><link rel="stylesheet" href="/style.css"></head><body><main id="app"><section class="card login" id="login"><h1>MusikBot187</h1><p>Musikserver & Discord/TS3-Bot</p><form id="loginForm"><input id="user" autocomplete="username" placeholder="Benutzername" required><input id="pass" type="password" autocomplete="current-password" placeholder="Passwort" required><button>Anmelden</button><div id="loginMsg"></div></form><div id="setupBox" hidden><h3>Ersteinrichtung</h3><input id="setupUser" placeholder="Admin-Benutzername"><input id="setupPass" type="password" placeholder="Admin-Passwort (mind. 12 Zeichen)"><button id="setupBtn">Admin anlegen</button><div id="setupMsg"></div></div></section><section id="dash" hidden><header><div><h1>MusikBot187</h1><small id="who"></small></div><button id="logout">Abmelden</button></header><nav><button data-tab="player">Player</button><button data-tab="search">Suche</button><button data-tab="playlists">Playlists</button><button data-tab="music">Musik</button><button data-tab="connections">Verbindungen</button><button data-tab="system">System</button><button data-tab="admin">Admin</button></nav><div id="views"><section id="view-player" class="view"><div class="grid"><div class="card"><h2>Jetzt läuft</h2><div id="now">—</div><div class="row"><button id="playPause">Pause</button><button id="skip">Skip</button><button id="stop">Stop</button><button id="clear">Queue leeren</button></div><label>Lautstärke <input id="volume" type="range" min="0" max="100" value="100"></label><select id="mode"><option value="repeat-off">Repeat aus</option><option value="repeat-one">Repeat Titel</option><option value="repeat-all">Repeat Queue</option><option value="shuffle">Shuffle</option></select></div><div class="card"><h2>Queue</h2><ol id="queue"></ol></div></div></section><section id="view-search" class="view" hidden><div class="card"><div class="row"><input id="query" placeholder="Interpret, Titel oder Radiosender"><select id="source"><option value="all">Alle</option><option value="youtube">YouTube</option><option value="radio">Radio</option><option value="spotify">Spotify</option></select><button id="searchBtn">Suchen</button></div><div id="results"></div></div></section><section id="view-playlists" class="view" hidden><div class="card"><div class="row"><input id="playlistName" placeholder="Neue Playlist"><button id="createPlaylist">Erstellen</button></div><div id="playlists"></div></div></section><section id="view-music" class="view" hidden><div class="card"><input id="upload" type="file" accept="audio/*"><button id="uploadBtn">Hochladen</button><div id="musicList"></div></div></section><section id="view-connections" class="view" hidden><div class="card"><h2>Discord</h2><div class="row"><input id="did" placeholder="Instanz-ID"><input id="dtoken" type="password" placeholder="Bot-Token"><input id="dguild" placeholder="Guild-ID"><input id="dvoice" placeholder="Voice-Channel-ID"><button id="saveDiscord">Speichern</button></div><div id="discordList"></div></div><div class="card"><h2>TeamSpeak 3</h2><div class="row"><input id="tid" placeholder="Instanz-ID"><input id="thost" placeholder="Host"><input id="tport" placeholder="Port" value="9987"><input id="tnick" placeholder="Nickname" value="MusikBot187"><input id="tchan" placeholder="Kanal"><input id="tpass" type="password" placeholder="Server-Passwort"><button id="saveTs3">Speichern</button></div><div id="ts3List"></div></div></section><section id="view-system" class="view" hidden><div class="card"><h2>System</h2><pre id="system"></pre><div class="row"><button data-control="restart-bot">Bot neustarten</button><button data-control="stop-bot">Bot stoppen</button><button data-control="start-bot">Bot starten</button><button data-control="restart-system">Ubuntu neu starten</button></div></div><div class="card"><h2>Diagnose</h2><pre id="diag"></pre></div></section><section id="view-admin" class="view" hidden><div class="card"><h2>Design</h2><div class="row"><select id="theme"><option>dark</option><option>light</option><option>ocean</option><option>purple</option><option>emerald</option><option>red</option><option>amber</option><option>slate</option></select><input id="accent" type="color" value="#6ea8fe"><button id="saveDesign">Speichern</button></div></div><div class="card"><h2>Benutzer</h2><div id="users"></div></div></section></div></section></main><script src="/app.js" defer></script></body></html>
