name: MusikBot187 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package.json
      - name: Install CI system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Prepare patched build tree
        run: |
          sudo rm -rf /opt/radiobot
          sudo mkdir -p /opt/radiobot/backend /opt/radiobot/frontend /opt/radiobot/patches /opt/radiobot/scripts
          sudo cp -a backend/. /opt/radiobot/backend/
          sudo cp -a frontend/. /opt/radiobot/frontend/
          sudo cp -a patches/. /opt/radiobot/patches/
          sudo cp -a scripts/. /opt/radiobot/scripts/
          sudo python3 /opt/radiobot/patches/enable-radio-features.py
          sudo python3 /opt/radiobot/patches/fix-radio-feature-patch.py
          sudo python3 /opt/radiobot/patches/setup-wizard.py
          sudo python3 /opt/radiobot/patches/ui-builder.py
          sudo python3 /opt/radiobot/patches/ui-builder-pointer.py
          sudo python3 /opt/radiobot/patches/final-hardening.py
          sudo python3 /opt/radiobot/patches/security-final.py
          sudo python3 /opt/radiobot/patches/final-setup-routes.py
          sudo python3 /opt/radiobot/patches/final-radio-routes.py
          sudo python3 /opt/radiobot/patches/web-auth.py
          sudo sed -i 's#<script src="/app.js"></script>#<script src="/app.js"></script><script src="/radio-enhancements.js"></script>#' /opt/radiobot/frontend/index.html
          sudo sed -i 's#<script src="/app.js"></script>#<script src="/app.js"></script><script src="/metrics-panel.js"></script>#' /opt/radiobot/frontend/index.html
          sudo sed -i 's#<script src="/app.js"></script>#<script src="/app.js"></script><script src="/setup-wizard.js"></script>#' /opt/radiobot/frontend/index.html
          sudo sed -i 's#</body>#<script src="/system-controls.js"></script><script src="/ui-builder.js"></script></body>#' /opt/radiobot/frontend/index.html
      - name: Static syntax checks
        run: |
          bash -n install.sh update.sh
          python3 -m py_compile patches/*.py scripts/*.py
          for f in frontend/*.js tests/*.js; do node --check "$f"; done
      - name: TypeScript build
        working-directory: /opt/radiobot/backend
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Functional release and service checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          checks = [
              (Path('install.sh').read_text(), r'^RELEASE_REF=v2\.1\.0$', 'install release ref'),
              (Path('install.sh').read_text(), 'refs/heads/$RELEASE_REF', 'install archive ref'),
              (Path('update.sh').read_text(), r'^RELEASE_REF=v2\.1\.0$', 'update release ref'),
              (Path('/opt/radiobot/frontend/index.html').read_text(), 'ui-builder.js', 'UI builder JS'),
              (Path('/opt/radiobot/frontend/index.html').read_text(), 'ui-builder.css', 'UI builder CSS'),
              (Path('/opt/radiobot/frontend/index.html').read_text(), 'web-auth.js', 'web auth JS'),
              (Path('/opt/radiobot/backend/src/index.ts').read_text(), '/api/ui/layout', 'UI layout API'),
              (Path('/opt/radiobot/backend/src/index.ts').read_text(), 'UiField', 'UI field model'),
              (Path('/opt/radiobot/frontend/ui-builder.js').read_text(), 'pointerdown', 'pointer drag'),
              (Path('/opt/radiobot/backend/src/index.ts').read_text(), "'/api/auth/login'", 'login API'),
              (Path('/opt/radiobot/backend/src/index.ts').read_text(), "'/api/auth/logout'", 'logout API'),
              (Path('/opt/radiobot/backend/src/index.ts').read_text(), '/api/system/reboot', 'reboot API'),
              (Path('/opt/radiobot/backend/src/index.ts').read_text(), '/api/system/shutdown', 'shutdown API'),
              (Path('/opt/radiobot/backend/src/index.ts').read_text(), 'DISCORD_COOLDOWN_MS', 'Discord cooldown'),
              (Path('/opt/radiobot/backend/src/index.ts').read_text(), 'DISCORD_GUILD_MAX_COMMANDS', 'Discord guild limit'),
              (Path('/opt/radiobot/backend/src/index.ts').read_text(), 'MAX_SEARCH_IN_FLIGHT', 'search concurrency'),
              (Path('radiobot.service').read_text(), 'ProtectSystem=strict', 'systemd hardening'),
              (Path('radiobot.service').read_text(), 'MemoryMax=720M', 'memory limit'),
              (Path('radiobot.service').read_text(), 'CPUQuota=90%', 'CPU limit'),
              (Path('/opt/radiobot/backend/src/index.ts').read_text(), "'/api/setup/status'", 'setup status API'),
              (Path('/opt/radiobot/backend/src/index.ts').read_text(), "'/api/radio/search'", 'radio search API'),
          ]
          ok = True
          for content, needle, label in checks:
              found = bool(re.search(needle, content, re.MULTILINE)) if needle.startswith('^') else (needle in content)
              print(f'CHECK {label}: {"OK" if found else "MISSING"}')
              if not found: ok = False
          if not ok: raise SystemExit(1)
          PY
          test -s frontend/ui-builder.js
          test -s frontend/ui-builder.css
          test -s /opt/radiobot/frontend/web-auth.js
      - name: FFmpeg audio smoke test
        run: |
          ffmpeg -version | head -n 1
          ffmpeg -hide_banner -loglevel error -f lavfi -i sine=frequency=1000:duration=2 -f s16le -ar 48000 -ac 2 -y /dev/null
      - name: Smoke test patched web API and session auth
        working-directory: /opt/radiobot/backend
        env:
          PORT: 3100
          APP_ROOT: /opt/radiobot
          DATA_DIR: ${{ runner.temp }}/musikbot187-data
          WEB_PASSWORD: test-password-12345
          WEB_USER: admin
        run: |
          set -Eeuo pipefail
          echo "CI_WEB_USER=$WEB_USER"
          echo "CI_WEB_PASSWORD_LENGTH=${#WEB_PASSWORD}"
          sudo mkdir -p /var/lib/radiobot
          sudo chown -R "$(id -un):$(id -gn)" /var/lib/radiobot
          rm -f /var/lib/radiobot/metrics.json /var/lib/radiobot/metrics.tmp
          python3 /opt/radiobot/scripts/system-metrics.py
          test -s /var/lib/radiobot/metrics.json
          chmod 0644 /var/lib/radiobot/metrics.json
          sudo rm -f /run/radiobot-privileged.sock
          sudo python3 - <<'PY' &
          import os, socket
          path='/run/radiobot-privileged.sock'
          try: os.unlink(path)
          except FileNotFoundError: pass
          s=socket.socket(socket.AF_UNIX, socket.SOCK_STREAM); s.bind(path); os.chmod(path, 0o666); s.listen(8)
          while True:
              c,_=s.accept()
              with c:
                  data=c.recv(16384); cmd=data.split(b'\n',1)[0]
                  if cmd in {b'bot-restart', b'bot-update', b'server-reboot', b'server-shutdown', b'config-write'}: c.sendall(b'OK\n')
                  else: c.sendall(b'ERR invalid-command\n')
          PY
          socket_pid=$!
          node dist/index.js > "$RUNNER_TEMP/musikbot187.log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true; kill $socket_pid 2>/dev/null || true' EXIT
          healthy=0
          for i in {1..20}; do
            if curl -fsS -u admin:test-password-12345 http://127.0.0.1:3100/api/health >/dev/null; then healthy=1; break; fi
            if ! kill -0 "$pid" 2>/dev/null; then
              echo 'Backend exited during smoke-test startup' >&2
              cat "$RUNNER_TEMP/musikbot187.log" >&2 || true
              exit 1
            fi
            sleep 1
          done
          if [[ "$healthy" -ne 1 ]]; then
            echo 'Backend health check timed out' >&2
            cat "$RUNNER_TEMP/musikbot187.log" >&2 || true
            exit 1
          fi
          login_code=$(curl -s -c /tmp/musikbot187.cookies -o /tmp/login-response.txt -w '%{http_code}' -H 'Content-Type: application/json' -d '{"username":"admin","password":"test-password-12345"}' http://127.0.0.1:3100/api/auth/login)
          echo "login_http=$login_code"
          test "$login_code" = 200
          session_code=$(curl -s -b /tmp/musikbot187.cookies -o /tmp/session-response.txt -w '%{http_code}' http://127.0.0.1:3100/api/auth/session)
          echo "session_http=$session_code"
          test "$session_code" = 200
          grep -q 'authenticated' /tmp/session-response.txt
          code=$(curl -s -b /tmp/musikbot187.cookies -o /tmp/setup-response.txt -w '%{http_code}' http://127.0.0.1:3100/api/setup/status)
          echo "setup_status_session_http=$code"
          test "$code" = 200 || { cat "$RUNNER_TEMP/musikbot187.log"; exit 1; }
          code=$(curl -s -b /tmp/musikbot187.cookies -o /tmp/radio-response.txt -w '%{http_code}' 'http://127.0.0.1:3100/api/radio/search?q=Beck%20FM')
          echo "radio_search_session_http=$code"
          test "$code" = 200 || { cat "$RUNNER_TEMP/musikbot187.log"; exit 1; }
          unauth_metrics=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/api/metrics)
          echo "metrics_unauth_http=$unauth_metrics"
          test "$unauth_metrics" != 200
          origin_code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Origin: https://evil.example' -b /tmp/musikbot187.cookies http://127.0.0.1:3100/api/settings)
          echo "origin_guard_http=$origin_code"
          test "$origin_code" != 200
          metrics_code=$(curl -s -b /tmp/musikbot187.cookies -o /tmp/metrics-response.txt -w '%{http_code}' http://127.0.0.1:3100/api/metrics)
          echo "metrics_session_http=$metrics_code"
          test "$metrics_code" = 200 || { cat "$RUNNER_TEMP/musikbot187.log"; exit 1; }
          curl -fsS -b /tmp/musikbot187.cookies -X POST http://127.0.0.1:3100/api/system/bot/disable >/dev/null
          curl -fsS -b /tmp/musikbot187.cookies -X POST http://127.0.0.1:3100/api/system/bot/enable >/dev/null
          curl -fsS -b /tmp/musikbot187.cookies -X POST http://127.0.0.1:3100/api/system/restart >/dev/null
          curl -fsS -b /tmp/musikbot187.cookies -X POST http://127.0.0.1:3100/api/update >/dev/null
          curl -fsS -b /tmp/musikbot187.cookies -X POST http://127.0.0.1:3100/api/system/reboot >/dev/null
          curl -fsS -b /tmp/musikbot187.cookies -X POST http://127.0.0.1:3100/api/system/shutdown >/dev/null
          logout_code=$(curl -s -b /tmp/musikbot187.cookies -o /tmp/logout-response.txt -w '%{http_code}' -X POST http://127.0.0.1:3100/api/auth/logout)
          echo "logout_http=$logout_code"
          test "$logout_code" = 200
          post_logout=$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/musikbot187.cookies http://127.0.0.1:3100/api/metrics)
          echo "metrics_post_logout_http=$post_logout"
          test "$post_logout" != 200
          echo 'setup + radio + session login/logout + protected metrics + origin guard + system controls OK'
      - name: Hardcore web performance test
        working-directory: /opt/radiobot/backend
        env:
          PORT: 3100
          APP_ROOT: /opt/radiobot
          DATA_DIR: ${{ runner.temp }}/musikbot187-perf-data
          WEB_PASSWORD: test-password-12345
          WEB_USER: admin
        run: |
          set -Eeuo pipefail
          taskset -c 0 node dist/index.js > "$RUNNER_TEMP/musikbot187-perf.log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          healthy=0
          for i in {1..20}; do
            if curl -fsS -u admin:test-password-12345 http://127.0.0.1:3100/api/health >/dev/null; then healthy=1; break; fi
            if ! kill -0 "$pid" 2>/dev/null; then cat "$RUNNER_TEMP/musikbot187-perf.log"; exit 1; fi
            sleep 1
          done
          if [[ "$healthy" -ne 1 ]]; then cat "$RUNNER_TEMP/musikbot187-perf.log"; exit 1; fi
          : > "$RUNNER_TEMP/musikbot187-perf-samples.log"
          (
            while kill -0 "$pid" 2>/dev/null; do
              ts=$(date +%s%N); rss=$(ps -o rss= -p "$pid" | tr -d ' '); cpu=$(ps -o %cpu= -p "$pid" | tr -d ' ')
              printf '%s %s %s\n' "$ts" "${rss:-0}" "${cpu:-0}" >> "$RUNNER_TEMP/musikbot187-perf-samples.log"; sleep 0.2
            done
          ) &
          monitor=$!
          python3 - <<'PY'
          import base64, concurrent.futures, urllib.request, time
          URL='http://127.0.0.1:3100/api/health'; TOTAL=2000; WORKERS=25
          AUTH='Basic '+base64.b64encode(b'admin:test-password-12345').decode()
          def hit(_):
              req=urllib.request.Request(URL,headers={'Authorization':AUTH})
              with urllib.request.urlopen(req,timeout=5) as r:
                  body=r.read()
                  if r.status!=200 or b'\"ok\":true' not in body: raise RuntimeError(r.status)
          start=time.perf_counter(); errors=0
          with concurrent.futures.ThreadPoolExecutor(max_workers=WORKERS) as ex:
              for fut in concurrent.futures.as_completed([ex.submit(hit,i) for i in range(TOTAL)]):
                  try: fut.result()
                  except Exception: errors+=1
          elapsed=time.perf_counter()-start
          print(f'perf_total={TOTAL} perf_workers={WORKERS} perf_errors={errors} perf_seconds={elapsed:.3f} perf_rps={TOTAL/elapsed:.1f}')
          if errors: raise SystemExit(f'{errors} request(s) failed')
          PY
          ffmpeg -hide_banner -loglevel error -re -f lavfi -i sine=frequency=440:sample_rate=48000 -t 20 -f s16le -ar 48000 -ac 2 -y /dev/null &
          ff=$!
          wait "$ff"
          kill "$pid" 2>/dev/null || true
          wait "$monitor" 2>/dev/null || true
          max_rss_kb=$(awk 'BEGIN{m=0} {if($2>m)m=$2} END{print m+0}' "$RUNNER_TEMP/musikbot187-perf-samples.log")
          max_cpu=$(awk 'BEGIN{m=0} {if($3>m)m=$3} END{print m+0}' "$RUNNER_TEMP/musikbot187-perf-samples.log")
          echo "perf_max_rss_kb=$max_rss_kb"
          echo "perf_max_cpu_percent=$max_cpu"
          echo "perf_max_rss_mb=$((max_rss_kb/1024))"
          test "$max_rss_kb" -lt 300000
          test "$(awk -v c="$max_cpu" 'BEGIN{print (c<100)?1:0}')" -eq 1
          cat "$RUNNER_TEMP/musikbot187-perf.log"
