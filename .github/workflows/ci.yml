name: CI
on:
  push:
    branches: [main, 'rewrite/**']
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package.json
      - run: npm install --prefix backend --no-audit --no-fund
      - run: node --check backend/src/server.js
      - run: node --check backend/src/player.js
      - run: node --check backend/src/media.js
      - run: node --check backend/src/integrations.js
      - run: node --check backend/src/ts3.js
      - run: bash -n install-latest.sh
      - run: npm test --prefix backend
      - run: node --test tests/deep-audit.mjs
