name: MusikBot187 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package.json
      - name: Prepare patched build tree
        run: |
          sudo rm -rf /opt/radiobot
          sudo mkdir -p /opt/radiobot/backend /opt/radiobot/frontend /opt/radiobot/patches
          sudo cp -a backend/. /opt/radiobot/backend/
          sudo cp -a frontend/. /opt/radiobot/frontend/
          sudo cp -a patches/. /opt/radiobot/patches/
          sudo sed -i 's/await app.register(cors, { origin: true });/await app.register(cors, { origin: false });/' /opt/radiobot/backend/src/index.ts
          sudo python3 /opt/radiobot/patches/enable-radio-features.py
          sudo python3 /opt/radiobot/patches/fix-radio-feature-patch.py
          sudo sed -i 's#<script src="/app.js"></script>#<script src="/app.js"></script><script src="/radio-enhancements.js"></script>#' /opt/radiobot/frontend/index.html
          sudo chown -R runner:docker /opt/radiobot
      - name: Install patched backend dependencies
        working-directory: /opt/radiobot/backend
        run: npm install
      - name: TypeScript build
        working-directory: /opt/radiobot/backend
        run: npm run build
      - name: Validate installer and service
        run: |
          bash -n install.sh
          grep -q 'CPUQuota=90%' radiobot.service
          grep -q 'MemoryMax=720M' radiobot.service
          grep -q 'MemoryHigh=640M' radiobot.service
          grep -q 'python3 "$APP_DIR/patches/enable-radio-features.py"' install.sh
          grep -q 'radio-enhancements.js' install.sh
          grep -q 'statusChannelId' backend/src/index.ts
          test -f frontend/radio-enhancements.js
          test -f patches/enable-radio-features.py
      - name: Smoke test patched web API
        working-directory: /opt/radiobot/backend
        env:
          PORT: 3100
          APP_ROOT: /opt/radiobot
          DATA_DIR: ${{ runner.temp }}/musikbot187-data
        run: |
          node dist/index.js > "$RUNNER_TEMP/musikbot187.log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:3100/api/health; then
              echo
              curl -fsS 'http://127.0.0.1:3100/api/radio/search?q=Beck%20FM' >/dev/null
              echo 'radio search OK'
              break
            fi
            sleep 1
          done
          if ! kill -0 "$pid" 2>/dev/null; then
            cat "$RUNNER_TEMP/musikbot187.log"
            exit 1
          fi
      - name: Hardcore web performance test
        working-directory: /opt/radiobot/backend
        env:
          PORT: 3100
          APP_ROOT: /opt/radiobot
          DATA_DIR: ${{ runner.temp }}/musikbot187-perf-data
        run: |
          node dist/index.js > "$RUNNER_TEMP/musikbot187-perf.log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:3100/api/health >/dev/null; then break; fi
            sleep 1
          done
          test -d "/proc/$pid"
          : > "$RUNNER_TEMP/musikbot187-perf-samples.log"
          (
            while kill -0 "$pid" 2>/dev/null; do
              ts=$(date +%s%N)
              rss=$(ps -o rss= -p "$pid" | tr -d ' ')
              cpu=$(ps -o %cpu= -p "$pid" | tr -d ' ')
              printf '%s %s %s\n' "$ts" "${rss:-0}" "${cpu:-0}" >> "$RUNNER_TEMP/musikbot187-perf-samples.log"
              sleep 0.2
            done
          ) &
          monitor=$!
          python3 - <<'PY'
          import concurrent.futures
          import urllib.request
          import time

          URL = 'http://127.0.0.1:3100/api/health'
          TOTAL = 2000
          WORKERS = 25

          def hit(_):
              with urllib.request.urlopen(URL, timeout=5) as r:
                  body = r.read()
                  if r.status != 200 or b'"ok":true' not in body:
                      raise RuntimeError(f'bad response: {r.status}')
              return 1

          start = time.perf_counter()
          errors = 0
          with concurrent.futures.ThreadPoolExecutor(max_workers=WORKERS) as ex:
              for fut in concurrent.futures.as_completed([ex.submit(hit, i) for i in range(TOTAL)]):
                  try:
                      fut.result()
                  except Exception:
                      errors += 1
          elapsed = time.perf_counter() - start
          print(f'perf_total={TOTAL} perf_workers={WORKERS} perf_errors={errors} perf_seconds={elapsed:.3f} perf_rps={TOTAL/elapsed:.1f}')
          if errors:
              raise SystemExit(f'{errors} request(s) failed')
          PY
          kill "$pid" 2>/dev/null || true
          wait "$monitor" 2>/dev/null || true
          max_rss_kb=$(awk 'BEGIN{m=0} {if($2>m)m=$2} END{print m+0}' "$RUNNER_TEMP/musikbot187-perf-samples.log")
          max_cpu=$(awk 'BEGIN{m=0} {if($3>m)m=$3} END{print m+0}' "$RUNNER_TEMP/musikbot187-perf-samples.log")
          echo "perf_max_rss_kb=$max_rss_kb"
          echo "perf_max_cpu_percent=$max_cpu"
          echo "perf_max_rss_mb=$((max_rss_kb/1024))"
          test "$max_rss_kb" -lt 300000
          test "$(awk -v c="$max_cpu" 'BEGIN{print (c<100)?1:0}')" -eq 1
          cat "$RUNNER_TEMP/musikbot187-perf.log"
