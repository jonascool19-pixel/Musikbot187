name: RadioBot CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax
        run: |
          set -euo pipefail
          bash -n install.sh install-final.sh update.sh scripts/resource-benchmark.sh scripts/ts3-resource-benchmark.sh
          node --check frontend/app.js
          node --check tests/smoke.mjs
      - name: Build
        working-directory: backend
        run: |
          npm install --include=dev --no-audit --no-fund
          npm run build
      - name: Smoke test
        run: node tests/smoke.mjs
      - name: Resource benchmark
        run: |
          chmod +x scripts/resource-benchmark.sh scripts/ts3-resource-benchmark.sh
          scripts/resource-benchmark.sh
          scripts/ts3-resource-benchmark.sh
