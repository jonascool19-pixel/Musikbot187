name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd backend && npm install --no-audit --no-fund
      - run: cd backend && npm test
      - run: cd backend && npx playwright install --with-deps chromium
      - run: cd backend && npm run test:browser
      - run: bash -n install-stable.sh
      - run: node --check backend/src/server.js
      - run: node --check backend/src/player.js
      - run: node --check backend/src/media.js
      - run: node --check backend/src/discord.js
      - run: node --check backend/src/ts3.js
      - run: node --check backend/src/store.js
      - run: node --check frontend/app.js
      - run: node --check frontend/errorlog.js
      - run: grep -F 'errorlog.js' frontend/index.html
      - run: grep -F 'releases/latest/download/yt-dlp' install-stable.sh
      - run: grep -F 'ExecStart=/usr/bin/node $APP/backend/src/server.js' install-stable.sh
