name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd backend && npm install --no-audit --no-fund
      - run: cd backend && npm test
      - run: cd backend && npx playwright install --with-deps chromium
      - run: cd backend && npm run test:browser
      - run: bash -n install-stable.sh
      - run: node --check backend/src/server.js
      - run: node --check backend/src/player.js
      - run: node --check backend/src/media.js
      - run: node --check backend/src/discord.js
      - run: node --check backend/src/ts3.js
      - run: node --check backend/src/store.js
      - run: node --check frontend/app.js
      - run: node --check frontend/errorlog.js
      - run: grep -F 'errorlog.js' frontend/index.html
      - run: grep -F 'releases/latest/download/yt-dlp' install-stable.sh
      - run: grep -F 'ExecStart=/usr/bin/node $APP/backend/src/server.js' install-stable.sh
      - name: Validate installer security configuration
        run: |
          grep -F 'SERVICE_USER="musikbot187"' install-stable.sh
          grep -F 'User=$SERVICE_USER' install-stable.sh
          grep -F 'ProtectSystem=full' install-stable.sh
          grep -F 'ProtectHome=true' install-stable.sh
          grep -F 'ReadWritePaths=$DATA' install-stable.sh
          grep -F 'visudo -cf /etc/sudoers.d/musikbot187' install-stable.sh
          grep -F 'MUSIKBOT187_CONTROL' install-stable.sh
          grep -F 'systemd als PID 1' install-stable.sh
          grep -F 'cgroups/systemd' install-stable.sh
      - name: Build Ubuntu 24.04 systemd installer test image
        run: |
          cat > /tmp/Dockerfile.musikbot187 <<'DOCKERFILE'
          FROM ubuntu:24.04
          ENV container=docker
          RUN apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y systemd systemd-sysv bash ca-certificates curl git sudo ffmpeg python3 python3-pip && rm -rf /var/lib/apt/lists/*
          STOPSIGNAL SIGRTMIN+3
          CMD ["/lib/systemd/systemd"]
          DOCKERFILE
          docker build -t musikbot187-ci:ubuntu2404-systemd -f /tmp/Dockerfile.musikbot187 /tmp
      - name: Run installer in isolated Ubuntu 24.04 systemd container
        run: |
          set -euo pipefail
          rm -rf /tmp/musikbot187-git && mkdir -p /tmp/musikbot187-git
          git clone --bare "$GITHUB_WORKSPACE" /tmp/musikbot187-git/radiobot.git
          git --git-dir=/tmp/musikbot187-git/radiobot.git update-server-info
          git daemon --reuseaddr --base-path=/tmp/musikbot187-git --export-all --port=29418 >/tmp/musikbot187-git.log 2>&1 &
          GIT_PID=$!
          trap 'kill "$GIT_PID" >/dev/null 2>&1 || true' EXIT
          sleep 1
          docker rm -f musikbot187-ci >/dev/null 2>&1 || true
          docker run -d --name musikbot187-ci --privileged --cgroupns=host --add-host=host.docker.internal:host-gateway musikbot187-ci:ubuntu2404-systemd
          trap 'docker rm -f musikbot187-ci >/dev/null 2>&1 || true; kill "$GIT_PID" >/dev/null 2>&1 || true' EXIT
          for i in {1..30}; do docker exec musikbot187-ci systemctl is-system-running >/dev/null 2>&1 && break; sleep 1; done
          docker exec musikbot187-ci bash -lc '
            set -euo pipefail
            git clone git://host.docker.internal:29418/radiobot.git /tmp/installer-repo
            cp /tmp/installer-repo/install-stable.sh /tmp/install-stable.sh
            sed -i "s#REPO=\"https://github.com/jonascool19-pixel/radiobot.git\"#REPO=\"git://host.docker.internal:29418/radiobot.git\"#" /tmp/install-stable.sh
            chmod 0755 /tmp/install-stable.sh
            bash -n /tmp/install-stable.sh
            /tmp/install-stable.sh
            test "$(. /etc/os-release && echo "$VERSION_ID")" = "24.04"
            test "$(cat /proc/1/comm)" = systemd
            test -d /sys/fs/cgroup
            id musikbot187
            test "$(stat -c %U /var/lib/musikbot187)" = musikbot187
            test "$(stat -c %U /opt/musikbot187)" = musikbot187
            grep -F "User=musikbot187" /etc/systemd/system/musikbot187.service
            grep -F "ProtectSystem=full" /etc/systemd/system/musikbot187.service
            grep -F "ProtectHome=true" /etc/systemd/system/musikbot187.service
            visudo -cf /etc/sudoers.d/musikbot187
            grep -F "musikbot187 ALL=(root) NOPASSWD" /etc/sudoers.d/musikbot187
            systemctl is-active --quiet musikbot187
            test "$(systemctl show -p User --value musikbot187)" = musikbot187
            ready=0
            for i in {1..30}; do
              if curl --fail --silent --show-error --max-time 2 http://127.0.0.1:3000/ >/dev/null; then
                ready=1
                break
              fi
              sleep 1
            done
            if [[ "$ready" -ne 1 ]]; then
              echo "MusikBot187 HTTP readiness timeout"
              systemctl status musikbot187 --no-pager || true
              journalctl -u musikbot187 --no-pager -n 100 || true
              ss -lntp || true
              exit 1
            fi
          '
      - name: Ubuntu 24.04 CT-style preflight
        run: |
          docker run --rm --privileged --cgroupns=host ubuntu:24.04 bash -lc '
            set -euo pipefail
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y bash ca-certificates curl ffmpeg git procps sudo python3 systemd systemd-sysv
            test "$(. /etc/os-release && echo "$VERSION_ID")" = "24.04"
            test -d /sys/fs/cgroup
            test -r /proc/1/comm
            command -v systemctl
            command -v ffmpeg
            command -v python3
          '
