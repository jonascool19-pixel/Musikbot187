name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package.json
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg python3 python3-venv
      - run: bash -n install-latest.sh
      - run: cd backend && npm install --no-audit --no-fund
      - run: cd backend && npm run check
      - run: node --test tests/core.test.mjs tests/import-contract.test.mjs tests/installer.test.mjs
