name: RadioBot CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package.json

      - name: Syntax
        run: |
          bash -n install.sh update.sh install-final.sh
          python3 -m py_compile patches/*.py scripts/*.py
          for f in frontend/*.js tests/*.js; do node --check "$f"; done

      - name: Pin check
        run: |
          test "$(sed -n 's/^PINNED_COMMIT=\"\([0-9a-f]\{40\}\)\"$/\1/p' install-final.sh)" = "6aa0a6bd594782bb9f4529bd7f1f0496de59a172"
          test "$(sed -n 's/^PINNED_COMMIT=\([0-9a-f]\{40\}\)$/\1/p' update.sh)" = "6aa0a6bd594782bb9f4529bd7f1f0496de59a172"

      - name: Prepare
        run: |
          sudo rm -rf /opt/radiobot
          sudo mkdir -p /opt/radiobot/backend /opt/radiobot/frontend /opt/radiobot/patches /opt/radiobot/scripts
          sudo cp -a backend/. /opt/radiobot/backend/
          sudo cp -a frontend/. /opt/radiobot/frontend/
          sudo cp -a patches/. /opt/radiobot/patches/
          sudo cp -a scripts/. /opt/radiobot/scripts/
          sudo cp radiobot.service /opt/radiobot/radiobot.service
          sudo cp radiobot-privileged.service /opt/radiobot/radiobot-privileged.service
          sudo python3 /opt/radiobot/patches/enable-radio-features.py
          sudo python3 /opt/radiobot/patches/fix-radio-feature-patch.py
          sudo python3 /opt/radiobot/patches/setup-wizard.py
          sudo python3 /opt/radiobot/patches/ui-builder.py
          sudo python3 /opt/radiobot/patches/ui-builder-pointer.py
          sudo python3 /opt/radiobot/patches/final-ui-handles.py
          sudo python3 /opt/radiobot/patches/final-hardening.py
          sudo python3 /opt/radiobot/patches/instance-routing.py
          sudo python3 /opt/radiobot/patches/security-final.py
          sudo python3 /opt/radiobot/patches/final-setup-routes.py
          sudo python3 /opt/radiobot/patches/final-radio-routes.py
          sudo python3 /opt/radiobot/patches/configure-helper-hardening.py
          sudo python3 /opt/radiobot/patches/web-auth.py

      - name: Backend build
        working-directory: /opt/radiobot/backend
        run: |
          npm install --include=dev --no-audit --no-fund
          npm run build

      - name: Wiring checks
        run: |
          grep -q "app.get('/api/setup/status'" /opt/radiobot/backend/src/index.ts
          grep -Eq "app\.post(<[^>]+>)?\('/api/setup/user'" /opt/radiobot/backend/src/index.ts
          grep -q "bootstrapUserOnly" /opt/radiobot/scripts/radiobot-configure.py
          grep -q "SupplementaryGroups=radiobot-ops" radiobot.service
          test -x /opt/radiobot/scripts/ts3-bot.ts || true
          grep -q "start:ts3" /opt/radiobot/backend/package.json

      - name: Privileged bootstrap smoke test
        run: |
          sudo groupadd -f radiobot-ops
          if ! id -u radiobot >/dev/null 2>&1; then sudo useradd --system --no-create-home --shell /usr/sbin/nologin radiobot; fi
          sudo usermod -a -G radiobot-ops radiobot
          sudo install -d -m 0755 -o root -g root /usr/local/libexec/radiobot
          sudo install -m 0755 -o root -g root /opt/radiobot/scripts/radiobot-privileged.py /usr/local/libexec/radiobot/radiobot-privileged.py
          sudo install -m 0644 /opt/radiobot/radiobot-privileged.service /etc/systemd/system/radiobot-privileged.service
          sudo install -m 0755 -o root -g root /opt/radiobot/scripts/radiobot-configure.py /usr/local/sbin/radiobot-configure
          sudo install -d -m 0700 /etc/radiobot
          printf '%s\n' 'DISCORD_TOKEN=' 'PORT=3000' 'WEB_USER=' 'WEB_PASSWORD=' 'DISCORD_CONTROL_ROLE=' 'SPOTIFY_CLIENT_ID=' 'SPOTIFY_CLIENT_SECRET=' 'SPOTIFY_REDIRECT_URI=' 'YOUTUBE_API_KEY=' 'YTDLP_PATH=/usr/local/bin/yt-dlp' 'SETUP_TOKEN=ci-test-token' | sudo tee /etc/radiobot/radiobot.env >/dev/null
          sudo chmod 0600 /etc/radiobot/radiobot.env
          sudo systemctl daemon-reload
          sudo systemctl restart radiobot-privileged.service
          test -S /run/radiobot-privileged.sock
          test "$(stat -c '%U:%G' /run/radiobot-privileged.sock)" = "root:radiobot-ops"
          sudo -u radiobot python3 -c 'import socket,json; p=json.dumps({"bootstrapUserOnly":True,"webUser":"ci-test","webPassword":"123456789012","setupToken":"ci-test-token"},separators=(",",":")); s=socket.socket(socket.AF_UNIX,socket.SOCK_STREAM); s.settimeout(3); s.connect("/run/radiobot-privileged.sock"); s.sendall(("config-write\\n"+p).encode()); assert s.recv(128)==b"OK\\n"'
          sudo grep -q '^WEB_USER=ci-test$' /etc/radiobot/radiobot.env
          sudo grep -q '^WEB_PASSWORD=123456789012$' /etc/radiobot/radiobot.env

      - name: UI browser test
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund --save-dev playwright@1.55.0
          npx playwright install chromium
          UI_TEST_ROOT=/opt/radiobot/frontend UI_TEST_PORT=4173 node tests/ui-builder-browser.js
