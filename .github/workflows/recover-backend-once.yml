name: Recover backend from known-good parent

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  recover:
    if: contains(github.event.head_commit.message, 'fix: make playable search items type-safe')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore backend from known-good parent and apply fixes
        run: |
          git checkout 0aaf359a98742b3d50095084be82a6dd9332d880 -- backend/src/index.ts
          python3 - <<'PY'
          from pathlib import Path
          p = Path('backend/src/index.ts')
          s = p.read_text(encoding='utf-8')
          s = s.replace("enqueue(interaction.guildId, { kind: item.kind, value: item.value, label: item.label, playlistName: 'Direkt' });", "enqueue(interaction.guildId, { kind: item.kind as SourceKind, value: item.value, label: item.label, playlistName: 'Direkt' });")
          s = s.replace("enqueue(interaction.guildId, { kind: item.kind, value: item.value, label: item.label, playlistName: 'Direkt' }, true);", "enqueue(interaction.guildId, { kind: item.kind as SourceKind, value: item.value, label: item.label, playlistName: 'Direkt' }, true);")
          s = s.replace("item = [...found.local, ...found.radios, ...found.youtube].find(x => x.kind !== 'spotify');", "item = [...found.local, ...found.radios, ...found.youtube].find((x): x is SearchItem & { kind: SourceKind } => x.kind !== 'spotify');")
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/src/index.ts
          git commit -m 'fix: recover backend and enforce playable source types'
          git push
