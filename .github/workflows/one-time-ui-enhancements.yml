name: One-time UI enhancements

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'chore: apply dashboard and Discord control enhancements'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply enhancements
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected exactly 1 occurrence, got {n}')
              p.write_text(s.replace(old, new, 1))

          # Discord: privileged Message Content intent is explicit and opt-in.
          p = Path('backend/src/discord.js')
          s = p.read_text()
          s = s.replace(
              'export function discordIntents(prefix = "") {\n  const intents = [GatewayIntentBits.Guilds, GatewayIntentBits.GuildVoiceStates];\n  if (String(prefix || "").trim()) intents.push(GatewayIntentBits.MessageContent);\n  return intents;\n}',
              'export function discordIntents(prefix = "", messageContentIntent = false) {\n  const intents = [GatewayIntentBits.Guilds, GatewayIntentBits.GuildVoiceStates];\n  if (Boolean(messageContentIntent) && String(prefix || "").trim()) intents.push(GatewayIntentBits.MessageContent);\n  return intents;\n}', 1)
          s = s.replace('this.client = new Client({ intents: discordIntents(cfg.prefix) });', 'this.client = new Client({ intents: discordIntents(cfg.prefix, cfg.messageContentIntent) });', 1)
          s = s.replace('inviteUrl: r.cfg.clientId && /^\\d{17,20}$/.test(r.cfg.clientId) ? `https://discord.com/oauth2/authorize?client_id=${encodeURIComponent(r.cfg.clientId)}&scope=bot%20applications.commands&permissions=36700160` : "" }));', 'inviteUrl: r.cfg.clientId && /^\\d{17,20}$/.test(r.cfg.clientId) ? `https://discord.com/oauth2/authorize?client_id=${encodeURIComponent(r.cfg.clientId)}&scope=bot%20applications.commands&permissions=36700160` : "", messageContentIntent: Boolean(r.cfg.messageContentIntent), voiceConnected: Boolean(r.voice) }));', 1)
          p.write_text(s)

          # Network: provide utilization percentages against reported link speed.
          p = Path('backend/src/system.js')
          s = p.read_text()
          start = s.index('export async function networkInfo(')
          end = s.index('export async function storageInfo', start)
          replacement = '''export async function networkInfo(selectedName = '') {\n  let traffic = [];\n  try { traffic = parseProcNetDev(await readFile('/proc/net/dev', 'utf8')); } catch {}\n\n  const now = process.hrtime.bigint();\n  const addresses = Object.entries(os.networkInterfaces()).map(([name, values]) => ({\n    name,\n    addresses: (values || []).map(v => ({ address: v.address, family: v.family, internal: v.internal }))\n  }));\n  const selectedAddresses = selectNetworkInterfaces(addresses, selectedName);\n  const selectedNames = new Set(selectedAddresses.map(x => x.name));\n  const measuredTraffic = selectedName ? traffic.filter(x => selectedNames.has(x.name)) : traffic;\n  const totalRxBytes = measuredTraffic.reduce((sum, x) => sum + x.rxBytes, 0);\n  const totalTxBytes = measuredTraffic.reduce((sum, x) => sum + x.txBytes, 0);\n  const key = selectedName || '*';\n  const previous = lastNetwork.get(key);\n  const elapsed = previous ? Math.max(0.001, Number(now - previous.time) / 1e9) : 0;\n  const rxBytesPerSecond = previous ? Math.max(0, (totalRxBytes - previous.rxBytes) / elapsed) : 0;\n  const txBytesPerSecond = previous ? Math.max(0, (totalTxBytes - previous.txBytes) / elapsed) : 0;\n  lastNetwork.set(key, { time: now, rxBytes: totalRxBytes, txBytes: totalTxBytes });\n\n  let totalLinkMbps = 0;\n  const interfaces = [];\n  for (const item of selectedAddresses) {\n    const stat = traffic.find(x => x.name === item.name);\n    let linkMbps = 0;\n    try {\n      linkMbps = Number((await readFile(`/sys/class/net/${item.name}/speed`, 'utf8')).trim());\n      if (!Number.isFinite(linkMbps) || linkMbps <= 0) linkMbps = 0;\n    } catch {}\n    totalLinkMbps += linkMbps;\n    interfaces.push({ ...item, rxBytes: stat?.rxBytes || 0, txBytes: stat?.txBytes || 0, linkSpeedMbps: linkMbps });\n  }\n\n  const capacityBps = totalLinkMbps * 1000000 / 8;\n  const rxUtilizationPercent = capacityBps > 0 ? Math.min(100, Number((rxBytesPerSecond / capacityBps * 100).toFixed(2))) : 0;\n  const txUtilizationPercent = capacityBps > 0 ? Math.min(100, Number((txBytesPerSecond / capacityBps * 100).toFixed(2))) : 0;\n  const totalUtilizationPercent = Math.min(100, Number((rxUtilizationPercent + txUtilizationPercent).toFixed(2)));\n\n  return {\n    hostname: os.hostname(),\n    interfaces,\n    totalRxBytes,\n    totalTxBytes,\n    rxBytesPerSecond,\n    txBytesPerSecond,\n    rxUtilizationPercent,\n    txUtilizationPercent,\n    totalUtilizationPercent,\n    linkSpeedMbps: totalLinkMbps,\n    measuredSeconds: elapsed\n  };\n}\n\n'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s)

          # Server: persist Discord intent toggle, expose connection status, add admin power controls.
          p = Path('backend/src/server.js')
          s = p.read_text()
          old = 'const x = { id: String(b.id || randomUUID()), name: String(b.name || old?.name || "Discord"), enabled: b.enabled !== false, token: b.token ? String(b.token) : String(old?.token || ""), clientId: String(b.clientId || old?.clientId || ""), guildId: String(b.guildId || old?.guildId || ""), channelId: String(b.channelId || old?.channelId || ""), prefix: String(b.prefix || old?.prefix || "!") };'
          new = 'const x = { id: String(b.id || randomUUID()), name: String(b.name || old?.name || "Discord"), enabled: b.enabled !== false, token: b.token ? String(b.token) : String(old?.token || ""), clientId: String(b.clientId || old?.clientId || ""), guildId: String(b.guildId || old?.guildId || ""), channelId: String(b.channelId || old?.channelId || ""), prefix: String(b.prefix ?? old?.prefix ?? ""), messageContentIntent: b.messageContentIntent === true } ;'
          s = s.replace(old, new, 1)
          old = 'app.get("/api/discord", async (request, reply) => { if (!auth(request, reply)) return; return publicDiscord(); });'
          new = 'app.get("/api/discord", async (request, reply) => { if (!auth(request, reply)) return; const runtime = new Map(discord.status().map(x => [x.id, x])); return publicDiscord().map(x => ({ ...x, connected: runtime.has(x.id), voiceConnected: runtime.get(x.id)?.voiceConnected === true })); });'
          s = s.replace(old, new, 1)
          old = 'if (!["restart-bot", "stop-bot"].includes(action)) return reply.code(400).send({ error: "Nur Bot-Neustart und Bot-Stopp werden unterstützt" });'
          new = 'if (!["start-bot", "restart-bot", "stop-bot", "restart-system", "shutdown-system"].includes(action)) return reply.code(400).send({ error: "Ungültige Control-Aktion" });'
          s = s.replace(old, new, 1)
          p.write_text(s)

          # Control helper and sudo policy: admin-only, narrowly scoped system actions.
          replace_once('install/control.sh', '  restart-bot) systemctl restart musikbot187 ;;\n  stop-bot) systemctl stop musikbot187 ;;\n  restart-system|shutdown-system)\n    echo "Systemweite Neustart-/Shutdown-Aktionen sind aus Sicherheitsgründen deaktiviert." >&2\n    exit 3\n    ;;', '  start-bot) systemctl start musikbot187 ;;\n  restart-bot) systemctl restart musikbot187 ;;\n  stop-bot) systemctl stop musikbot187 ;;\n  restart-system) systemctl reboot ;;\n  shutdown-system) systemctl poweroff ;;')

          p = Path('install-stable.sh')
          s = p.read_text()
          s = s.replace('Cmnd_Alias MUSIKBOT187_CONTROL = /usr/bin/systemctl restart musikbot187, /usr/bin/systemctl stop musikbot187', 'Cmnd_Alias MUSIKBOT187_CONTROL = /usr/bin/systemctl start musikbot187, /usr/bin/systemctl restart musikbot187, /usr/bin/systemctl stop musikbot187, /usr/bin/systemctl reboot, /usr/bin/systemctl poweroff', 1)
          p.write_text(s)

          # Frontend: add top controls/instance chooser, status dots, and explicit Message Content toggle.
          p = Path('frontend/app.js')
          s = p.read_text()
          s = s.replace('monitor: { system: null, network: null },', 'monitor: { system: null, network: null, health: null },', 1)
          s = s.replace('function topMetrics() {', '''function controlHeader() {\n  const items = [\n    ...(state.data?.discord || []).map(x => ({ type: 'discord', id: x.id, name: `Discord · ${x.name}`, connected: x.connected })),\n    ...(state.data?.ts3 || []).map(x => ({ type: 'ts3', id: x.id, name: `TS3 · ${x.name}`, connected: x.connected }))\n  ];\n  const selected = `${state.data?.settings?.outputType || 'none'}:${state.data?.settings?.outputId || ''}`;\n  return `<div class="control-header"><label>Ausgabeinstanz<select id="outputInstance"><option value="none:">Keine</option>${items.map(x => `<option value="${esc(x.type)}:${esc(x.id)}" ${selected === `${x.type}:${x.id}` ? 'selected' : ''}>${esc(x.connected ? '🟢' : '🔴')} ${esc(x.name)}</option>`).join('')}</select></label><button id="botPower" class="power">⏻ Bot <span>${state.monitor.health?.ok ? 'Ein' : 'Aus'}</span></button><button id="osRestart" class="power">↻ Ubuntu</button><button id="osShutdown" class="power danger">⏻ Ubuntu</button></div>`;\n}\nfunction topMetrics() {''', 1)
          s = s.replace('<div><b>🌐 Netzwerk</b><span id="topNetRx">RX ${network ? fmtRate(network.rxBytesPerSecond) : \'-\'}</span><small id="topNetTx">TX ${network ? fmtRate(network.txBytesPerSecond) : \'-\'}</small></div>', '<div><b>🌐 Netzwerk</b><span id="topNetRx">↓ ${network ? `${network.rxUtilizationPercent ?? 0}%` : \'-\'}</span><small id="topNetTx">↑ ${network ? `${network.txUtilizationPercent ?? 0}%` : \'-\'}</small></div>', 1)
          s = s.replace('if (network && $(\'#topNetRx\')) $(\'#topNetRx\').textContent = `RX ${fmtRate(network.rxBytesPerSecond)}`;\n  if (network && $(\'#topNetTx\')) $(\'#topNetTx\').textContent = `TX ${fmtRate(network.txBytesPerSecond)}`;', 'if (network && $(\'#topNetRx\')) $(\'#topNetRx\').textContent = `↓ ${network.rxUtilizationPercent ?? 0}%`;\n  if (network && $(\'#topNetTx\')) $(\'#topNetTx\').textContent = `↑ ${network.txUtilizationPercent ?? 0}%`;', 1)
          s = s.replace('const [systemData, networkData] = await Promise.all([api(\'/api/system\'), api(\'/api/network\')]);\n    state.monitor.system = systemData;\n    state.monitor.network = networkData;', 'const [systemData, networkData, health] = await Promise.all([api(\'/api/system\'), api(\'/api/network\'), api(\'/api/health\')]);\n    state.monitor.system = systemData;\n    state.monitor.network = networkData;\n    state.monitor.health = health;', 1)
          s = s.replace("$('#app').innerHTML = `<header class=\"top\"><div><h1>MusikBot187</h1><small>${esc(state.user.name)} · ${esc(state.user.role)}</small></div><div id=\"clock\" class=\"clock\" aria-live=\"polite\">--:--:--</div></header>${topMetrics()}${nav()}<div id=\"notice\"></div><main id=\"view\"></main>`;", "$('#app').innerHTML = `<header class=\"top\"><div><h1>MusikBot187</h1><small>${esc(state.user.name)} · ${esc(state.user.role)}</small></div><div class=\"top-right\">${controlHeader()}<div id=\"clock\" class=\"clock\" aria-live=\"polite\">--:--:--</div></div></header>${topMetrics()}${nav()}<div id=\"notice\"></div><main id=\"view\"></main>`;", 1)
          s = s.replace("$('#logout').onclick = () => { stopTimers(); state.token = null; state.user = null; loginView(); };\n    updateClock();", "$('#logout').onclick = () => { stopTimers(); state.token = null; state.user = null; loginView(); };\n    wireControlHeader();\n    updateClock();", 1)
          s = s.replace('function stopTimers() { clearInterval(state.monitorTimer); clearInterval(state.clockTimer); clearTimeout(state.timer); }', '''function wireControlHeader() {\n  $('#outputInstance').onchange = async (e) => {\n    const [type, id] = String(e.target.value).split(':');\n    try { await put('/api/settings', { outputType: type, outputId: id || '' }); await load(); render(); } catch (error) { fail(error); }\n  };\n  $('#botPower').onclick = async () => {\n    try { const action = state.monitor.health?.ok ? 'stop-bot' : 'start-bot'; await post('/api/control', { action }); note(action === 'start-bot' ? 'Bot wird gestartet.' : 'Bot wird gestoppt.'); } catch (error) { fail(error); }\n  };\n  $('#osRestart').onclick = async () => { if (!confirm('Ubuntu jetzt neu starten?')) return; try { await post('/api/control', { action: 'restart-system' }); } catch (error) { fail(error); } };\n  $('#osShutdown').onclick = async () => { if (!confirm('Ubuntu jetzt herunterfahren?')) return; try { await post('/api/control', { action: 'shutdown-system' }); } catch (error) { fail(error); } };\n}\nfunction stopTimers() { clearInterval(state.monitorTimer); clearInterval(state.clockTimer); clearTimeout(state.timer); }''', 1)
          s = s.replace('<input id="dp" value="!"><label class="checklabel"><input id="de" type="checkbox" checked> Aktiv</label>', '<input id="dp" value=""><label class="checklabel"><input id="de" type="checkbox" checked> Aktiv</label><label class="checklabel"><input id="dmci" type="checkbox"> Message Content Intent</label>', 1)
          s = s.replace('Bot-ID ${esc(item.clientId || \'-\')} · Server ${esc(item.guildId || \'-\')} · Voice ${esc(item.channelId || \'-\')}', '${item.connected ? "🟢" : "🔴"} Bot-ID ${esc(item.clientId || \'-\')} · Server ${esc(item.guildId || \'-\')} · Voice ${esc(item.channelId || \'-\')}')
          s = s.replace("$('#dadd').onclick = () =>", "$('#dmci').checked = false;\n  $('#dadd').onclick = () =>", 1)
          s = s.replace("$('#ds').onclick = saveDiscord;", "$('#ds').onclick = saveDiscord;", 1)
          s = s.replace("enabled: $('#de').checked });", "enabled: $('#de').checked, messageContentIntent: $('#dmci').checked });", 1)
          s = s.replace("$('#dp').value = item.prefix || '!'; $('#de').checked = item.enabled !== false;", "$('#dp').value = item.prefix || ''; $('#de').checked = item.enabled !== false; $('#dmci').checked = item.messageContentIntent === true;", 1)
          s = s.replace("if ($('#dp')) $('#dp').value = '!';", "if ($('#dp')) $('#dp').value = ''; if ($('#dmci')) $('#dmci').checked = false;", 1)
          p.write_text(s)

          # Frontend CSS additions.
          p = Path('frontend/style.css')
          s = p.read_text()
          s += '''\n.control-header{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.control-header label{display:flex;align-items:center;gap:5px;font-size:.72rem}.control-header select{padding:7px 9px;max-width:210px}.top-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}.power{padding:7px 10px;font-size:.78rem}.power.danger{border-color:#8c3b43;background:#54252b}.power span{margin-left:3px}.discord-editor .checklabel{padding-top:10px}.discord-editor .checklabel input{width:auto}\n@media(max-width:900px){.top-right{align-items:flex-end}.control-header{justify-content:flex-end}}\n'''
          p.write_text(s)

          # Tests: target new controls and network utilization.
          p = Path('tests/monitoring.test.mjs')
          s = p.read_text()
          s = s.replace('  assert.ok(Array.isArray(info.interfaces));', '  assert.equal(typeof info.rxUtilizationPercent, "number");\n  assert.equal(typeof info.txUtilizationPercent, "number");\n  assert.ok(info.rxUtilizationPercent >= 0 && info.rxUtilizationPercent <= 100);\n  assert.ok(info.txUtilizationPercent >= 0 && info.txUtilizationPercent <= 100);\n  assert.ok(Array.isArray(info.interfaces));', 1)
          s = s.replace('  assert.match(app, /Discord-Server/);\n  assert.match(app, /Voice-Kanal/);', '  assert.match(app, /Discord-Server/);\n  assert.match(app, /Voice-Kanal/);\n  assert.match(app, /outputInstance/);\n  assert.match(app, /restart-system/);\n  assert.match(app, /shutdown-system/);\n  assert.match(app, /Message Content Intent/);', 1)
          p.write_text(s)

          p = Path('tests/dashboard.browser.test.mjs')
          s = p.read_text()
          s = s.replace('if (url.pathname === "/api/network") return json(res, { interfaces: {} });', 'if (url.pathname === "/api/network") return json(res, { interfaces: [], rxUtilizationPercent: 2.2, txUtilizationPercent: 0.4, totalRxBytes: 2200, totalTxBytes: 400, rxBytesPerSecond: 100, txBytesPerSecond: 20 });', 1)
          s = s.replace('if (url.pathname === "/api/control") return json(res, { ok: true });', 'if (url.pathname === "/api/control") return json(res, { ok: true });', 1)
          s = s.replace('await page.getByRole("button", { name: /Bearbeiten/ }).first().click();', 'await page.getByRole("button", { name: /Bearbeiten/ }).first().click();\n  await assertText(page, "Message Content Intent");\n  await page.locator("#outputInstance").selectOption({ label: /Discord/ });', 1)
          s = s.replace('"GET /api/diagnostics", "GET /api/search", "POST /api/play/clear"', '"GET /api/diagnostics", "GET /api/search", "POST /api/play/clear"', 1)
          p.write_text(s)

          # Remove this one-time workflow from the committed result.
          Path('.github/workflows/one-time-ui-enhancements.yml').unlink()

      - name: Verify syntax and core tests
        run: |
          npm --prefix backend install --omit=dev --no-audit --no-fund
          node --check backend/src/server.js
          node --check backend/src/discord.js
          node --check backend/src/system.js
          cd backend && npm test && npm run test:browser

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/src/server.js backend/src/discord.js backend/src/system.js frontend/app.js frontend/style.css install/control.sh install-stable.sh tests/monitoring.test.mjs tests/dashboard.browser.test.mjs .github/workflows/one-time-ui-enhancements.yml
          git diff --cached --quiet || git commit -m 'chore: apply dashboard and Discord control enhancements'
          git push
